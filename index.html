function rock(x,z,size){const p=project(v(x,.08,z));if(!p)return;const s=p.scale*size;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(.3);ctx.beginPath();ctx.moveTo(-.88*s,.08*s);ctx.quadraticCurveTo(-.85*s,-.65*s,-.24*s,-.72*s);ctx.quadraticCurveTo(.54*s,-.78*s,.95*s,-.18*s);ctx.quadraticCurveTo(1.08*s,.64*s,.2*s,.68*s);ctx.quadraticCurveTo(-.8*s,.67*s,-.88*s,.08*s);const g=ctx.createLinearGradient(-s,-s,s,s);g.addColorStop(0,'#cec7b0');g.addColorStop(.5,'#aaad9b');g.addColorStop(1,'#828e82');ctx.fillStyle=g;ctx.fill();ctx.restore()}
function roundPart(a,b,width,color,light){const p=project(a),q=project(b);if(!p||!q)return;const wd=width*(p.scale+q.scale)*.5;ctx.lineCap='round';ctx.strokeStyle=color;ctx.lineWidth=wd;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();ctx.strokeStyle=light;ctx.lineWidth=Math.max(1,wd*.24);ctx.beginPath();ctx.moveTo(p.x-wd*.13,p.y-wd*.12);ctx.lineTo(q.x-wd*.13,q.y-wd*.12);ctx.stroke()}
function transformed(local,origin,dir,pitch=0,roll=0){const b=basis(dir),x=local.x*Math.cos(roll)-local.y*Math.sin(roll),y=local.x*Math.sin(roll)+local.y*Math.cos(roll),zz=local.z*Math.cos(pitch)-y*Math.sin(pitch),yy=y*Math.cos(pitch)+local.z*Math.sin(pitch);return add(origin,add(mul(b.r,x),add(v(0,yy,0),mul(b.f,zz))))}
function solveKnee(hip,ankle,face,side){const d=sub(ankle,hip),dist=clamp(len(d),.0001,.89),dir=norm(d),L1=.47,L2=.47,a=(L1*L1-L2*L2+dist*dist)/(2*dist),h=Math.sqrt(Math.max(0,L1*L1-a*a));const b=basis(face);let bend=add(mul(b.f,.88),mul(b.r,side*.18));bend=norm(sub(bend,mul(dir,dot(bend,dir))));return add(add(hip,mul(dir,a)),mul(bend,h));}
function feetAndLegs(){const p=physics,b=basis(p.facing),body=v(p.x,p.hopY+p.bob,p.z);for(const f of legs){const hip=add(body,add(v(0,.82,0),mul(b.r,f.side*.18)));const ankle=add(f.foot,v(0,p.hopY*.72,0)),knee=solveKnee(hip,ankle,p.facing,f.side);roundPart(hip,knee,.16,'#b68160','#d7ae7f');roundPart(knee,ankle,.145,'#af795a','#d3a67b');const front=add(ankle,mul(b.f,.125)),back=add(ankle,mul(b.f,-.07));roundPart(back,front,.18,'#815e50','#b18468');const q=project(front);if(q){blob(front,.14,.08,['#b9886b','#986b58','#765546'],0)}if(showFeet){const c=project(v(f.foot.x,.04,f.foot.z));if(c){ctx.beginPath();ctx.arc(c.x,c.y,5,0,TAU);ctx.fillStyle=f.swing?'#f6e38d':'#537e62';ctx.fill()}}}}
function drawCreature(){const p=physics,b=basis(p.facing),speed=Math.hypot(p.vx,p.vz);const chest=v(p.x,p.hopY+p.bob+.99,p.z),leanDir=mul(b.f,p.lean*.26),swayDir=mul(b.r,p.sway*.17);let center=add(chest,add(leanDir,swayDir));
// Very soft, grounded shadows; feet are real persistent contact points.
const shadow=project(v(p.x,.02,p.z));if(shadow){ctx.save();ctx.filter='blur(12px)';ctx.fillStyle=`rgba(69,85,47,${.15-.08*clamp(p.hopY,0,1)})`;ctx.beginPath();ctx.ellipse(shadow.x,shadow.y,shadow.scale*.53,shadow.scale*.19,0,0,TAU);ctx.fill();ctx.restore()}
feetAndLegs();
// Tail and small hands are attached to body and lag when turning.
const behind=transformed(v(Math.sin(p.armLag)*.09,.00,-.36),center,p.facing,p.lean,p.sway);blob(behind,.21,.21,['#f2d09e','#dca574','#ad7659']);
for(const side of [-1,1]){const other=legs.find(f=>f.side===-side),swing=other.swing?Math.sin(other.phase*Math.PI)*Math.min(1,speed*.9):0;let shoulder=transformed(v(side*.34,.16,0),center,p.facing,p.lean,p.sway),elbow=transformed(v(side*.46,-.09,-.03+side*(swing*.12+p.armLag*.25)),center,p.facing,p.lean,p.sway),hand=transformed(v(side*.39,-.28,.04+side*(swing*.19+p.armLag*.32)),center,p.facing,p.lean,p.sway);roundPart(shoulder,elbow,.175,'#c3906b','#e6b98d');roundPart(elbow,hand,.16,'#bd8663','#e5b489');blob(hand,.085,.085,['#f1c79b','#dca579','#ae795d']);}
// Large clay-like pear body, cream bib toward the facing direction.
blob(center,.46,.54,['#f6d49e','#d7a276','#aa7055'],p.sway*.32);const bib=transformed(v(0,-.075,.19),center,p.facing,p.lean,p.sway);const faceVis=Math.cos(angleWrap(p.headYaw-camYaw));if(faceVis>-.05)blob(bib,.275,.315,['#fff0c7','#eed2a6','#d5b289']);
const head=transformed(v(0,.64+p.headNod*.06,.055+p.headNod*.05),center,p.facing,p.lean*.48,p.sway*.75);const hSide=basis(p.headYaw);const earBase=head;
for(const side of [-1,1]){const bottom=add(earBase,add(mul(hSide.r,side*.25),v(0,.19,0)));const tip=add(earBase,add(mul(hSide.r,side*(.31+p.earLag*.18)),add(v(0,.58+(side===-1?.05:0)-Math.abs(p.earLag)*.08,0),mul(hSide.f,p.earLag*.35))));roundPart(bottom,tip,.19,'#c48c6c','#e7b88c');blob(tip,.10,.18,['#f3d1a2','#d7a17c','#aa765e']);if(faceVis>.12){const inner=add(tip,mul(hSide.f,.07));blob(inner,.047,.12,['#eec3ad','#d9a08f','#be847c'])}}
blob(head,.46,.46,['#fff0c4','#e4b98b','#bd8665'],p.sway*.25);
if(faceVis>.16){const front=hSide.f,right=hSide.r;for(const side of [-1,1]){const eye=add(head,add(mul(right,side*.19),add(v(0,.03,0),mul(front,.35))));const q=project(eye);if(q){ctx.save();const rad=Math.max(1.2,q.scale*.026);ctx.fillStyle='#3b4b41';ctx.beginPath();ctx.ellipse(q.x,q.y,rad,p.blink>0?Math.max(1,rad*.18):rad*1.2,0,0,TAU);ctx.fill();if(p.blink===0){ctx.beginPath();ctx.arc(q.x-rad*.27,q.y-rad*.33,Math.max(1,rad*.29),0,TAU);ctx.fillStyle='#fff9e0';ctx.fill()}ctx.restore()}}const nose=add(head,add(v(0,-.15,0),mul(front,.39))),n=project(nose);if(n){ctx.fillStyle='#a46e66';ctx.beginPath();ctx.ellipse(n.x,n.y,n.scale*.046,n.scale*.027,0,0,TAU);ctx.fill();ctx.strokeStyle='#916b60';ctx.lineWidth=Math.max(1,n.scale*.009);ctx.beginPath();ctx.arc(n.x,n.y+n.scale*.026,n.scale*.046,.16,Math.PI-.16);ctx.stroke()}}
}
function ground(){const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#d7e5bf');g.addColorStop(.54,'#edf0ce');g.addColorStop(1,'#c9dba9');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
// Distant colors provide depth without turning the study into a whole world.
ctx.save();ctx.filter='blur(35px)';ctx.fillStyle='#a8c4a181';ctx.beginPath();ctx.ellipse(w*.15,h*.48,w*.35,h*.18,0,0,TAU);ctx.ellipse(w*.96,h*.43,w*.3,h*.22,0,0,TAU);ctx.fill();ctx.restore();
const points=[],N=72;for(let i=0;i<N;i++){const a=i*TAU/N,r=6.0+.20*Math.sin(a*3+1)+.16*Math.sin(a*7-1);points.push(project(v(Math.cos(a)*r,.0,Math.sin(a)*r)))}if(points.every(Boolean)){ctx.save();ctx.beginPath();ctx.moveTo(points[0].x,points[0].y+7);for(let i=1;i<points.length;i++)ctx.lineTo(points[i].x,points[i].y+7);ctx.closePath();ctx.shadowBlur=34;ctx.shadowColor='#758d6780';ctx.fillStyle='#8fac7a';ctx.fill();ctx.restore();ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);for(let i=1;i<points.length;i++)ctx.lineTo(points[i].x,points[i].y);ctx.closePath();const p=project(v(0,0,0)),rad=Math.max(w,h);const shade=ctx.createRadialGradient(p?.x||w/2,(p?.y||h/2)-rad*.2,rad*.04,p?.x||w/2,p?.y||h/2,rad*.9);shade.addColorStop(0,'#e9e9ae');shade.addColorStop(.55,'#c9dba0');shade.addColorStop(1,'#aac995');ctx.fillStyle=shade;ctx.fill()}
for(let i=0;i<22;i++){const a=i*2.399,r=1.0+.19*i,pt=project(v(Math.cos(a)*r,.013,Math.sin(a)*r));if(!pt)continue;const rr=pt.scale*(.05+(i%4)*.026);ctx.fillStyle=['#d6dd9e29','#f6ecc042','#a1bf8c29'][i%3];ctx.beginPath();ctx.ellipse(pt.x,pt.y,rr*4,rr*1.4,a,0,TAU);ctx.fill()}
const pieces=[];for(const g of grass){const q=project(v(g.x,0,g.z));if(q)pieces.push({d:q.depth,draw:()=>tuft(g)})}for(const f of petals){const q=project(v(f.x,0,f.z));if(q)pieces.push({d:q.depth,draw:()=>flower(f)})}for(const rock0 of pebbles){const q=project(v(rock0.x,0,rock0.z));if(q)pieces.push({d:q.depth,draw:()=>rock(rock0.x,rock0.z,rock0.s)})}
pieces.sort((a,b)=>b.d-a.d);for(const z of pieces)z.draw();
if(showFeet){for(const f of footprints){if(f.age>8)continue;const q=project(v(f.x,.014,f.z));if(!q)continue;ctx.fillStyle=`rgba(86,125,80,${.36*Math.min(1,(8-f.age)/2)})`;ctx.beginPath();ctx.ellipse(q.x,q.y,q.scale*.13,q.scale*.073,physics.facing,0,TAU);ctx.fill()}}
}
function draw(){C=camera();ground();drawCreature();const gradient=ctx.createRadialGradient(w*.5,h*.43,Math.min(w,h)*.18,w*.5,h*.5,Math.max(w,h)*.85);gradient.addColorStop(0,'#fff9db00');gradient.addColorStop(1,'#566d4b1b');ctx.fillStyle=gradient;ctx.fillRect(0,0,w,h)}
function animate(now){let dt=Math.min(.033,(now-last)/1000||.016);last=now;if(!document.hidden){update(dt);draw();renderStats.frames++}requestAnimationFrame(animate)}requestAnimationFrame(animate);
// Public observables for automated browser regression checks, not gameplay controls.
window.__perplungMotionDebug={get state(){return {...physics,feet:legs.map(f=>({side:f.side,swing:f.swing,foot:{...f.foot},steps:f.steps,impact:f.impact})),joystick:{...joy},frames:renderStats.frames}},hop,reset};
})();
