<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/><title>A Little Place</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3e9d7;color:#4c4835;font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:820px;margin:auto;padding:12px}.head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:3px 0 10px}.head strong{font-size:20px;letter-spacing:-.7px}.head span{font-size:12px;color:#867b5f}.frame{position:relative;overflow:hidden;border-radius:20px;box-shadow:0 8px 23px #634b2630;border:3px solid #fff7e6;background:#bfd49b}canvas{display:block;width:100%;aspect-ratio:720/440;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}.whisper{position:absolute;left:12px;bottom:12px;padding:7px 11px;background:#fff7e7d9;border-radius:99px;max-width:calc(100% - 24px);font-size:12px;font-weight:550;pointer-events:none;box-shadow:0 2px 9px #54411f15}.tools{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.tools button{border:1px solid #c7cbb0;color:#52634e;background:#fffaec;border-radius:99px;padding:10px 13px;font:600 13px system-ui;flex:1;min-width:88px;cursor:pointer;transition:background .2s}.tools button[aria-pressed=true]{background:#477d64;color:#fff;border-color:#477d64}.hint{font-size:12px;color:#84775f;text-align:center;margin:11px 0 3px;line-height:1.5}@media(max-width:420px){main{padding:8px}.head strong{font-size:18px}.head span{font-size:11px}.whisper{font-size:10px}.tools button{padding:10px 7px;min-width:67px;font-size:12px}}
</style></head><body><main><div class="head"><strong>A Little Place <span aria-hidden="true">✦</span></strong><span>an experiment in curiosity</span></div><div class="frame"><canvas id="pond" aria-label="Interactive sunlit meadow with a stream and a small wandering creature"></canvas><div class="whisper" id="whisper" aria-live="polite">Somebody small lives here. See what it likes.</div></div><div class="tools" role="group" aria-label="Play with the world"><button data-tool="wonder" aria-pressed="true">✧ Explore</button><button data-tool="leaf" aria-pressed="false">🍃 Leaf</button><button data-tool="stone" aria-pressed="false">● Stone</button><button data-tool="berry" aria-pressed="false">✿ Berry</button><button data-tool="seed" aria-pressed="false">✳ Seed</button></div><p class="hint">Tap to place or stir things. Drag objects around. Then watch what happens.</p></main>
<script>(()=>{
const canvas=document.getElementById('pond'),ctx=canvas.getContext('2d'),note=document.getElementById('whisper');
const W=720,H=440,DPR=Math.min(2,window.devicePixelRatio||1);canvas.width=W*DPR;canvas.height=H*DPR;ctx.scale(DPR,DPR);
let t=0,last=performance.now(),tool='wonder',held=null,point=null,until=0, wanderAt=0;
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(a,b,c)=>Math.max(b,Math.min(c,a));
const streamY=x=>258+26*Math.sin(x*.008+0.6)+9*Math.sin(x*.022-0.4),inWater=(x,y)=>Math.abs(y-streamY(x))<49;
let things=[{type:'stone',x:254,y:199,r:17},{type:'stone',x:492,y:302,r:14},{type:'leaf',x:390,y:204,r:14,rot:-1},{type:'leaf',x:615,y:146,r:13,rot:1},{type:'berry',x:488,y:135,r:9}],ripples=[],motes=[],flowers=[],grass=[];
const creature={x:125,y:168,tx:160,ty:185,face:1,blink:0,rest:0,happy:0,step:0};
for(let i=0;i<125;i++){let x=rnd(0,W),y=rnd(12,H);if(!inWater(x,y))grass.push({x,y,s:rnd(2,7),a:rnd(0,7),c:i%4});}
for(let i=0;i<24;i++){let x=rnd(20,W-20),y=rnd(30,H-25);if(!inWater(x,y))flowers.push({x,y,age:30,color:i%3});}
for(let i=0;i<22;i++)motes.push({x:rnd(0,W),y:rnd(0,H),r:rnd(1,3),phase:rnd(0,7)});
function say(s){note.textContent=s;until=t+4.5;}
function pathBand(width){ctx.beginPath();for(let x=-20;x<=W+20;x+=12){const y=streamY(x)-width/2;x===-20?ctx.moveTo(x,y):ctx.lineTo(x,y);}for(let x=W+20;x>=-20;x-=12)ctx.lineTo(x,streamY(x)+width/2);ctx.closePath();}
function oval(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill();}
function drawFlower(f){let k=clamp(f.age/6,0,1),r=4.4*k;if(k<=0)return;ctx.strokeStyle='#668b4d';ctx.lineWidth=1.7;ctx.beginPath();ctx.moveTo(f.x,f.y+4);ctx.lineTo(f.x+Math.sin(t+f.x)*1.4,f.y-4);ctx.stroke();const petals=['#fff2bb','#ffccbb','#e8dfff'];ctx.fillStyle=petals[f.color];for(let j=0;j<5;j++){let a=j*Math.PI*2/5+t*.035;oval(f.x+Math.cos(a)*r,f.y-5+Math.sin(a)*r,2.7*k,3.4*k,petals[f.color]);}oval(f.x,f.y-5,2.6*k,2.6*k,'#e7aa54');}
function drawThing(o){let bob=Math.sin(t*2+o.x*.1)*.9;oval(o.x+2,o.y+7,o.r*.86,4,'#4d63352a');if(o.type==='stone'){let g=ctx.createLinearGradient(o.x-o.r,o.y-o.r,o.x+o.r,o.y+o.r);g.addColorStop(0,'#c6c4ad');g.addColorStop(.55,'#9eaaa0');g.addColorStop(1,'#738d86');oval(o.x,o.y,o.r,o.r*.7,g);oval(o.x-o.r*.28,o.y-o.r*.26,o.r*.35,o.r*.12,'#e6ddbb9c');if(inWater(o.x,o.y))oval(o.x+o.r*.9,o.y+2,5,1.4,'#eaf9deb9');}
else if(o.type==='berry'){oval(o.x,o.y+bob,10,9,'#a64363');oval(o.x-2,o.y-3+bob,3.2,2,'#f3a6a7');ctx.strokeStyle='#69804c';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(o.x,o.y-8+bob);ctx.lineTo(o.x+2,o.y-13+bob);ctx.stroke();}
else if(o.type==='leaf'){ctx.save();ctx.translate(o.x,o.y+bob);ctx.rotate((o.rot||0)*.5+Math.sin(t*2+o.y)*.13);oval(0,0,13,8,'#8aaa62');oval(-3,-2,6,3,'#c1d080');ctx.strokeStyle='#587e47';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(-13,0);ctx.lineTo(13,0);ctx.stroke();ctx.restore();}
else if(o.type==='seed'){let a=clamp((t-o.born)/6,0,1);ctx.strokeStyle='#718d4b';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(o.x,o.y+4);ctx.lineTo(o.x,o.y-8*a);ctx.stroke();if(a>.1){oval(o.x-4*a,o.y-3*a,5*a,2.5*a,'#93b969');oval(o.x+4*a,o.y-7*a,5*a,2.5*a,'#7cac6b');}if(a>=1&&!o.bloomed){o.bloomed=true;flowers.push({x:o.x,y:o.y,age:0,color:Math.floor(rnd(0,3))});say('Something new is growing.');}}
}
function drawCreature(){let c=creature,b=Math.sin(t*7+c.step)*1.2;oval(c.x,c.y+18,18,5,'#485b3040');ctx.save();ctx.translate(c.x,c.y+b);ctx.scale(c.face,1);let body=ctx.createRadialGradient(-6,-8,1,1,4,31);body.addColorStop(0,'#ffe4a6');body.addColorStop(.75,'#dfa16d');body.addColorStop(1,'#b97757');oval(0,1,21,18,body);oval(-10,-15,7,12,'#bd8662');oval(8,-16,7,12,'#bd8662');oval(-10,-16,3.2,7,'#ecc39b');oval(8,-16,3.2,7,'#ecc39b');oval(-11,15,6.4,4,'#a56a4f');oval(10,15,6.4,4,'#a56a4f');oval(5,2,13,11,'#f6c991');let blink= (Math.sin(t*.65)> .996);if(blink){ctx.strokeStyle='#513f38';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-2,-3);ctx.lineTo(2,-3);ctx.moveTo(12,-3);ctx.lineTo(15,-3);ctx.stroke();}else{oval(0,-3,2.1,2.6,'#3f3c35');oval(13,-3,2.1,2.6,'#3f3c35');}oval(7,2,2.7,2.1,'#a16b60');oval(-4,5,3,2,'#e8a48f8a');ctx.restore();if(c.happy>0){ctx.font='18px serif';ctx.fillText('♡',c.x+19,c.y-23+Math.sin(t*5)*3);}}
function draw(){
let g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#e4e6b0');g.addColorStop(.45,'#a8c988');g.addColorStop(1,'#9bc18b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
for(let i=0;i<15;i++){let x=(i*139+42)%W,y=(i*97+28)%H;oval(x,y,70+i%3*14,26,'#e8d9a222');}
// warm shafts of sunlight
ctx.fillStyle='#fff5bb20';for(let i=0;i<4;i++){let x=80+i*173;ctx.beginPath();ctx.moveTo(x,-20);ctx.lineTo(x+50,-20);ctx.lineTo(x+145,H+20);ctx.lineTo(x+80,H+20);ctx.closePath();ctx.fill();}
// grassy stream banks and water
pathBand(133);ctx.fillStyle='#769e78';ctx.fill();pathBand(119);ctx.fillStyle='#d9ce91';ctx.fill();pathBand(106);let wg=ctx.createLinearGradient(0,195,0,360);wg.addColorStop(0,'#70b6ac');wg.addColorStop(.5,'#7fc9bc');wg.addColorStop(1,'#4a9fa8');ctx.fillStyle=wg;ctx.fill();
ctx.save();pathBand(106);ctx.clip();for(let j=0;j<23;j++){let x=(j*64+t*(13+j%3*8))%(W+130)-60,y=streamY(x)+(j%5-2)*17;ctx.strokeStyle=j%3===0?'#e5f5d68c':'#c0eadd6b';ctx.lineWidth=j%4===0?2:1;ctx.beginPath();ctx.ellipse(x,y,18+j%3*7,3,.08,Math.PI*.1,Math.PI*.9);ctx.stroke();}ctx.restore();
for(const a of grass){let s=Math.sin(t*1.6+a.a)*2.4;ctx.strokeStyle=['#789f58','#9dbb68','#7f9d64','#ced48b'][a.c];ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(a.x,a.y+3);ctx.quadraticCurveTo(a.x+s,a.y-a.s,a.x+s+2,a.y-a.s-4);ctx.stroke();}
for(const f of flowers){f.age+=.015;drawFlower(f);}
// Overhanging foliage
for(const side of [0,1]){ctx.save();if(side)ctx.translate(W,0);for(let i=0;i<13;i++){let x=-35+(i%5)*29,y=-38+Math.floor(i/5)*24;oval(x+Math.sin(t*.6+i)*1.8,y,52-(i%3)*7,35+(i%3)*5,['#5f986b','#76a36d','#90b875'][i%3]);}ctx.restore();}
for(const o of things)drawThing(o);
for(const r of ripples){ctx.strokeStyle=`rgba(255,250,222,${.65*(1-r.age/1.3)})`;ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(r.x,r.y,7+r.age*35,4+r.age*17,0,0,Math.PI*2);ctx.stroke();}
for(const m of motes){const alpha=.3+.3*Math.sin(t*1.7+m.phase);oval(m.x+Math.sin(t*.4+m.phase)*5,m.y+Math.cos(t*.3+m.phase)*5,m.r,m.r,`rgba(255,246,190,${alpha})`);}
drawCreature();
let shade=ctx.createRadialGradient(W/2,H/2,120,W/2,H/2,490);shade.addColorStop(0,'#fff2a100');shade.addColorStop(1,'#7b673820');ctx.fillStyle=shade;ctx.fillRect(0,0,W,H);
}
function update(dt){t+=dt;for(const o of things){if(o.type==='leaf'&&inWater(o.x,o.y)&&held!==o){o.x+=dt*17;o.y+=Math.sin(t*2+o.x)*dt*3;}if(o.type==='seed'&&!o.bloomed&&t-o.born>12){o.bloomed=true;flowers.push({x:o.x,y:o.y,age:0,color:1});} }things=things.filter(o=>o.x<W+35&&o.y>-35);
for(const r of ripples)r.age+=dt;ripples=ripples.filter(r=>r.age<1.3);
const c=creature;c.happy=Math.max(0,c.happy-dt);c.rest=Math.max(0,c.rest-dt);
let closest=null,closestD=1e9;for(const o of things)if(o.type==='berry'){const d=Math.hypot(c.x-o.x,c.y-o.y);if(d<closestD){closestD=d;closest=o;}}
if(closest){c.tx=closest.x;c.ty=closest.y;if(closestD<16){things.splice(things.indexOf(closest),1);c.happy=3;c.rest=1.4;c.tx=c.x;c.ty=c.y;things.push({type:'seed',x:closest.x+8,y:closest.y+8,r:8,born:t});ripples.push({x:closest.x,y:closest.y,age:.3});say('A berry became a seed. Curious.');}}
else if(t>wanderAt){c.tx=rnd(55,W-55);c.ty=rnd(75,H-60);wanderAt=t+rnd(3,7);}
let d=Math.hypot(c.tx-c.x,c.ty-c.y);if(c.rest<=0&&d>5){let speed=closest?43:21;c.x+=(c.tx-c.x)/d*Math.min(d,speed*dt);c.y+=(c.ty-c.y)/d*Math.min(d,speed*dt);c.face=c.tx>=c.x?1:-1;c.step+=dt;}else c.step*=.92;
if(t>until&&note.textContent!=='Take your time. The world is in no hurry.')note.textContent='Take your time. The world is in no hurry.';
}
function pos(e){const b=canvas.getBoundingClientRect();return{x:(e.clientX-b.left)/b.width*W,y:(e.clientY-b.top)/b.height*H};}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();const p=pos(e);point=p;held=null;for(let i=things.length-1;i>=0;i--){let o=things[i];if(Math.hypot(p.x-o.x,p.y-o.y)<Math.max(o.r+10,22)&&o.type!=='seed'){held=o;break;}}if(held){canvas.setPointerCapture(e.pointerId);return;}if(tool==='wonder'){ripples.push({x:p.x,y:p.y,age:0});if(inWater(p.x,p.y))say('The stream carries every ripple somewhere.');else{motes.push({x:p.x,y:p.y,r:3,phase:t});say('Something rustles in the grass.');}}else{let o={type:tool,x:p.x,y:p.y,r:tool==='stone'?rnd(13,18):tool==='berry'?9:12,rot:rnd(-2,2),born:t};things.push(o);ripples.push({x:p.x,y:p.y,age:.15});if(tool==='leaf'&&inWater(p.x,p.y))say('The current knows where to take it.');else if(tool==='berry')say('A little nose has noticed something.');else if(tool==='seed')say('Some things take a little time.');else say('Every little thing has a place.');}});
canvas.addEventListener('pointermove',e=>{if(!held)return;e.preventDefault();const p=pos(e);held.x=clamp(p.x,8,W-8);held.y=clamp(p.y,8,H-8);});
function release(){if(held){if(held.type==='leaf'&&inWater(held.x,held.y))say('The leaf has caught the current.');held=null;}}
canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);
for(const b of document.querySelectorAll('[data-tool]'))b.addEventListener('click',()=>{tool=b.dataset.tool;for(const other of document.querySelectorAll('[data-tool]'))other.setAttribute('aria-pressed',String(other===b));});
function loop(now){let dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;update(dt);draw();requestAnimationFrame(loop);}requestAnimationFrame(loop);
})();</script></body></html>
